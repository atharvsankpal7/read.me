<style>
/* ==========================================================================
   Blog page shell. Inlined into every exported post and the blog index.
   Tokens match the portfolio (build/styles.css) so posts feel like the same site:
   one framed 50rem column, hatched dividers, JetBrains Mono, blue links.
   ========================================================================== */
:root {
  color-scheme: light;
  --bg: #f8f7f4;
  --bg-2: #f1f0ec;
  --fg: #080808;
  --fg-soft: #27272a;
  --muted: #71717a;
  --faint: #a1a1aa;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --card: #fcfbf9;
  --primary: #18181b;
  --secondary: #f4f4f5;
  --accent: #0000cd;
  --accent-2: #00009a;
  --accent-ink: #0000cd;
  --accent-soft: rgba(0, 0, 205, 0.06);
  --accent-line: rgba(0, 0, 205, 0.25);
  --code-bg: #f4f4f5;
  --ok: #15803d; --ok-soft: rgba(21, 128, 61, 0.08);
  --warn: #b45309; --warn-soft: rgba(180, 83, 9, 0.08);
  --bad: #dc2626; --bad-soft: rgba(220, 38, 38, 0.07);
  --info: #2563eb; --info-soft: rgba(37, 99, 235, 0.07);
  --shadow-sm: none;
  --shadow-md: 0 4px 6px -1px #0000000f, 0 12px 28px -8px #00000024;
  --shadow-lg: none;
  --ease: cubic-bezier(0, 0, 0.2, 1);
  --hatch: repeating-linear-gradient(-45deg, var(--border) 0 1px, transparent 1px 10px);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* The site is set in mono throughout; --sans exists for the simulation kit. */
  --sans: var(--mono);
  --system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
  --pad: 40px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--mono);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
}
::selection { background: #000; color: var(--bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
img, svg, video, canvas { max-width: 100%; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
.skip-link { position: absolute; left: 8px; top: -40px; z-index: 60; padding: 4px 8px; background: var(--bg); font-size: 14px; color: var(--fg); }
.skip-link:focus { top: 8px; }

/* ---------- frame ---------- */
.page {
  max-width: 50rem; min-height: 100vh; margin: 0 auto; padding: 80px 0 0;
  display: flex; flex-direction: column; gap: 40px;
  border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  animation: reveal .7s var(--ease) both;
}
@keyframes reveal { from { opacity: 0; filter: blur(10px); transform: translateY(20px); } }
.hatch { height: 24px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background-image: var(--hatch); }
.post { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.back { padding: 0 var(--pad); }
.back a {
  display: inline-flex; align-items: center; gap: 4px; width: fit-content;
  color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 2px;
}
.back a:hover { color: var(--fg); }
.back svg { width: 12px; height: 12px; }

/* reading progress + back to top */
.progress { position: fixed; top: 0; left: 0; z-index: 50; height: 4px; width: 0; background: var(--primary); }
.to-top {
  position: fixed; right: 16px; bottom: 16px; z-index: 50;
  width: 40px; height: 40px; border: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--primary); color: #fff;
  opacity: 0; transform: translateY(40px); pointer-events: none;
  transition: opacity .3s ease-in-out, transform .3s ease-in-out;
}
.to-top.show { opacity: 1; transform: none; pointer-events: auto; }
.to-top svg { width: 22px; height: 22px; }

/* ---------- post header ---------- */
.post-head { display: flex; flex-direction: column; gap: 16px; padding: 56px var(--pad); }
.post-head h1 {
  margin: 0; color: var(--accent); font-size: 36px; line-height: 1.11; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance;
}
.post-head .meta { margin: 0; color: var(--muted); font-size: 14px; }
.post-head .lede { margin: 0; color: var(--fg-soft); font-size: 14px; line-height: 1.7; max-width: 62ch; }
.post-head .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tag {
  font-size: 11px; line-height: 20px; font-weight: 500; padding: 0 8px; border-radius: 999px;
  color: var(--accent); background: var(--accent-soft);
}
.tag.live { display: inline-flex; align-items: center; gap: 6px; }
.tag.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

/* ---------- table of contents ---------- */
.toc { padding: var(--pad); border-bottom: 1px solid var(--border); }
.toc h2 { margin: 0; font-size: 16px; font-weight: 500; }
.toc ol { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.toc a { display: block; padding-left: 16px; color: var(--muted); text-decoration: none; transition: color .15s ease; }
.toc a::before { content: "•\00a0\00a0"; }
.toc a.sub { padding-left: 32px; }
.toc a.sub::before { content: "◦\00a0\00a0"; }
.toc a:hover, .toc a.active { color: var(--fg); }

/* ---------- prose ---------- */
.article { padding: var(--pad); min-width: 0; }
.prose { display: flex; flex-direction: column; gap: 24px; min-width: 0; text-align: justify; }
.prose + .prose, .lab-wrap + .prose { margin-top: 24px; }
.prose > * { margin: 0; }
.prose p { line-height: 28px; text-wrap: pretty; }
.prose strong { font-weight: 600; }
.prose a { color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 4px; }
.prose a:hover { opacity: .8; }
.prose h2, .prose h3, .prose h4 { position: relative; color: var(--fg); font-weight: 600; letter-spacing: -0.025em; text-align: left; text-wrap: balance; padding: 12px 0; }
.prose h2 { font-size: 30px; line-height: 1.2; margin-top: 24px; }
.prose h3 { font-size: 24px; line-height: 1.33; }
.prose h4 { font-size: 20px; line-height: 1.4; }
.anchor {
  position: absolute; left: -1.1em; top: 50%; transform: translateY(-50%);
  color: var(--muted); text-decoration: none !important; opacity: 0; font-weight: 400; transition: opacity .15s ease;
}
.prose :is(h2, h3, h4):hover .anchor, .anchor:focus-visible { opacity: 1; }
.anchor:hover { color: var(--fg); }
.prose ul, .prose ol { padding-left: 24px; color: var(--muted); }
.prose ul { list-style: disc; }
.prose li { line-height: 36px; }
.prose li strong { color: var(--muted); }
.prose li > p { margin: 0; }
.prose hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
.prose blockquote { margin: 0; padding-left: 24px; border-left: 2px solid var(--border); color: var(--muted); font-style: italic; }
.prose img { border: 1px solid var(--border); }
.prose :not(pre) > code { font: 400 14px var(--mono); padding: 2px 4px; background: var(--code-bg); }
.prose table { width: 100%; border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; text-align: left; }
.prose th, .prose td { border: 1px solid var(--border); padding: 8px 16px; vertical-align: top; }
.prose th { font-weight: 600; }

/* code blocks */
.code { position: relative; border: 1px solid var(--border); background: var(--code-bg); text-align: left; }
.code-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--muted); text-transform: lowercase;
}
.copy {
  border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  font-size: 12px; padding: 4px 10px; cursor: pointer; transition: color .15s ease, border-color .15s ease;
}
.copy:hover { color: var(--fg); border-color: var(--primary); }
.copy.done { color: var(--ok); }
.code pre { margin: 0; padding: 16px; overflow-x: auto; font: 400 14px/1.7 var(--mono); tab-size: 2; }
.code pre code { font: inherit; }

/* callouts: > [!NOTE] / [!TIP] / [!IMPORTANT] / [!WARNING] / [!CAUTION] / [!TRY] */
.prose .callout {
  --c: var(--info); --c-soft: var(--info-soft);
  border-left: 4px solid var(--c); background: var(--c-soft); text-align: left;
  padding: 16px; display: grid; grid-template-columns: 20px 1fr; gap: 4px 12px;
}
.prose .callout-icon { grid-row: span 2; color: var(--c); padding-top: 2px; }
.prose .callout-icon svg { width: 18px; height: 18px; display: block; }
.prose .callout-title { font-weight: 600; color: var(--c); font-size: 14px; }
.prose .callout-body > * + * { margin-top: 8px; }
.prose .callout-body p { font-size: 15px; line-height: 26px; margin: 0; }
.prose .callout.tip, .prose .callout.try { --c: var(--ok); --c-soft: var(--ok-soft); }
.prose .callout.important { --c: var(--accent); --c-soft: var(--accent-soft); }
.prose .callout.warning { --c: var(--warn); --c-soft: var(--warn-soft); }
.prose .callout.caution { --c: var(--bad); --c-soft: var(--bad-soft); }

/* ---------- simulation lab (breaks out of the column, it needs the room) ---------- */
.lab-wrap {
  position: relative;
  width: min(1440px, 100vw - 32px);
  left: 50%; transform: translateX(-50%);
  margin: 40px 0 16px;
}
.lab { background: var(--bg); border: 1px solid var(--border-strong); overflow: hidden; }
.lab-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--border);
}
.lab-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.lab-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.lab-title { font-size: 16px; font-weight: 600; letter-spacing: -0.025em; color: var(--fg); margin: 4px 0 0; line-height: 1.3; }
.lab-hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 2px 0 0; }
.lab-head .grow { flex: 1; min-width: 220px; }
.lab-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer;
  border: 1px solid var(--primary); background: transparent; color: var(--primary); transition: background-color .15s ease;
}
.icon-btn:hover { background: var(--secondary); }
.icon-btn svg { width: 16px; height: 16px; }
.lab-body { padding: 16px; background: var(--bg-2); }
.lab:fullscreen { border: 0; overflow: auto; background: var(--bg-2); }
.lab:fullscreen .lab-body { min-height: calc(100vh - 70px); }
.lab:-webkit-full-screen { width: 100%; height: 100%; overflow: auto; }
.lab .fs-exit { display: none; }
.lab:fullscreen .fs-exit, .lab.fake-fs .fs-exit { display: block; }
.lab:fullscreen .fs-enter, .lab.fake-fs .fs-enter { display: none; }
.lab.fake-fs { position: fixed; inset: 0; z-index: 100; border: 0; overflow: auto; background: var(--bg-2); }
.lab-error {
  margin: 0; padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent);
  background: var(--bad-soft); color: var(--bad); font: 13px/1.55 var(--mono); white-space: pre-wrap;
}

/* ---------- previous / next ---------- */
.pager { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 32px 16px 80px; border-top: 1px solid var(--border); }
.pager a { flex: 1; min-width: 0; color: var(--fg); text-decoration: none; }
.pager a.next { text-align: right; }
.pager .dir { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.pager a.next .dir { justify-content: flex-end; }
.pager a:hover .dir { color: var(--fg); }
.pager .dir svg { width: 16px; height: 16px; }
.pager .title { margin: 4px 0 0; font-size: 18px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- blog index ---------- */
.index-list { list-style: none; margin: 0; padding: 0 var(--pad); display: flex; flex-direction: column; gap: 20px; }
.index-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.post-link {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  color: var(--accent); font-weight: 500;
  text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px;
  transition: text-decoration-color .2s var(--ease), opacity .2s var(--ease);
}
.post-link:hover { text-decoration-color: var(--accent); opacity: .9; }
.post-link .arrow { display: inline-flex; flex: none; transition: transform .2s var(--ease); }
.post-link:hover .arrow { transform: translate(2px, -2px); }
.post-link svg { width: 18px; height: 18px; }
.index-list .date { margin: 0; opacity: .8; white-space: nowrap; }
.index-end { height: 80px; }

/* writing preview popover (index page) */
.popover {
  position: fixed; z-index: 50; width: min(22rem, 100vw - 2rem); padding: 16px 18px 18px;
  background: var(--bg); border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); border-radius: 10px;
  box-shadow: var(--shadow-md); font: 15px/1.55 var(--system);
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s var(--ease), transform .15s var(--ease);
}
.popover.show { opacity: 1; transform: none; }
.popover h3 { margin: 0 0 8px; color: var(--accent); font-size: 17px; font-weight: 600; line-height: 1.35; letter-spacing: -0.02em; }
.popover .meta { margin: 0 0 12px; font-size: 12px; color: color-mix(in srgb, var(--fg) 55%, transparent); }
.popover .body { margin: 0; font-size: 14px; line-height: 1.6; color: color-mix(in srgb, var(--fg) 82%, transparent); }

@media (max-width: 639px) {
  :root { --pad: 16px; }
  .page { padding-top: 40px; }
  .post-head { padding: 40px var(--pad); }
  .post-head h1 { font-size: 24px; line-height: 1.33; }
  .prose { text-align: left; text-wrap: pretty; }
  .prose h2 { font-size: 20px; }
  .prose h3 { font-size: 18px; }
  .prose h4 { font-size: 16px; }
  .toc a, .toc h2 { font-size: 14px; }
  .toc a { padding-left: 8px; }
  .toc a.sub { padding-left: 16px; }
  .lab-body { padding: 10px; }
  .lab-head { padding: 12px 12px 12px 14px; }
  .anchor { display: none; }
  .index-list li { flex-direction: column; }
  .index-list .date { font-size: 14px; }
  .popover { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  .progress, .to-top, .lab-wrap, .pager, .back { display: none !important; }
  .page { border: 0; }
}

</style>
</head>

<script>
/* Blog page runtime: reading progress, back to top, toc, previews, code copy, lab chrome, and the Kit API for simulations. */
(function () {
  "use strict";
  var doc = document, root = doc.documentElement;

  /* ---------- theme ----------
     The site is light only. The studio preview can force a theme via data-theme, and Kit.onTheme
     listeners still fire when that attribute changes. */
  var themeListeners = [];
  function currentTheme() { return root.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  new MutationObserver(function () {
    var t = currentTheme();
    themeListeners.slice().forEach(function (fn) { try { fn(t); } catch (e) { console.error(e); } });
  }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- reading progress + back to top ---------- */
  var prog = doc.querySelector(".progress"), toTop = doc.querySelector(".to-top"), ticking = false;
  function onScroll() {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = window.scrollY, max = Math.max(1, doc.documentElement.scrollHeight - innerHeight);
      if (prog) prog.style.width = (Math.min(1, y / max) * 100).toFixed(2) + "%";
      if (toTop) toTop.classList.toggle("show", y > 400);
    });
  }
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  if (toTop) toTop.addEventListener("click", function () { scrollTo({ top: 0, behavior: "smooth" }); });

  /* ---------- writing previews (blog index) ---------- */
  var previewLinks = doc.querySelectorAll(".post-link[data-preview-body]");
  if (previewLinks.length && window.matchMedia && matchMedia("(hover: hover)").matches) {
    var pop = doc.createElement("div"), current = null;
    pop.className = "popover"; pop.setAttribute("aria-hidden", "true");
    pop.innerHTML = '<h3></h3><p class="meta"></p><p class="body"></p>';
    doc.body.appendChild(pop);
    var show = function (a) {
      current = a;
      pop.querySelector("h3").textContent = a.textContent.trim();
      pop.querySelector(".meta").textContent = [a.dataset.previewDate, a.dataset.previewMinutes && a.dataset.previewMinutes + " min read"].filter(Boolean).join(" · ");
      pop.querySelector(".body").textContent = a.dataset.previewBody;
      var r = a.getBoundingClientRect(), gap = 8, h = pop.offsetHeight;
      var top = r.bottom + gap + h <= innerHeight ? r.bottom + gap : r.top - gap - h;
      pop.style.top = Math.max(8, top) + "px";
      pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 16)) + "px";
      pop.classList.add("show");
    };
    var hide = function () { current = null; pop.classList.remove("show"); };
    previewLinks.forEach(function (a) {
      a.addEventListener("mouseenter", function () { show(a); });
      a.addEventListener("focus", function () { show(a); });
      a.addEventListener("mouseleave", hide);
      a.addEventListener("blur", hide);
    });
    addEventListener("scroll", function () {
      if (!current) return;
      if (current.matches(":hover") || current === doc.activeElement) show(current); else hide();
    }, { passive: true });
  }

  /* ---------- toc highlight ---------- */
  var tocLinks = [].slice.call(doc.querySelectorAll(".toc a"));
  if (tocLinks.length && "IntersectionObserver" in window) {
    var byId = {}, heads = [];
    tocLinks.forEach(function (a) {
      var id = decodeURIComponent(a.getAttribute("href").slice(1)), h = doc.getElementById(id);
      if (h) { byId[id] = a; heads.push(h); }
    });
    var visible = {};
    var setActive = function () {
      var best = null;
      for (var i = 0; i < heads.length; i++) {
        if (heads[i].getBoundingClientRect().top < innerHeight * 0.35) best = heads[i]; else break;
      }
      tocLinks.forEach(function (a) { a.classList.remove("active"); });
      if (best && byId[best.id]) byId[best.id].classList.add("active");
    };
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { visible[e.target.id] = e.isIntersecting; }); setActive(); }, { rootMargin: "0px 0px -60% 0px" });
    heads.forEach(function (h) { io.observe(h); });
    addEventListener("scroll", function () { requestAnimationFrame(setActive); }, { passive: true });
    setActive();
  }

  /* ---------- code copy ---------- */
  doc.querySelectorAll(".code .copy").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var code = btn.closest(".code").querySelector("pre code");
      var txt = code ? code.textContent : "";
      var done = function () { btn.textContent = "Copied"; btn.classList.add("done"); setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () {});
      else { var ta = doc.createElement("textarea"); ta.value = txt; doc.body.appendChild(ta); ta.select(); try { doc.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
    });
  });

  /* ---------- lab: fullscreen ---------- */
  doc.querySelectorAll(".lab").forEach(function (lab) {
    lab.querySelectorAll("[data-fullscreen]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var fsEl = doc.fullscreenElement || doc.webkitFullscreenElement;
        if (fsEl) { (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc); return; }
        if (lab.classList.contains("fake-fs")) { lab.classList.remove("fake-fs"); doc.body.style.overflow = ""; return; }
        var req = lab.requestFullscreen || lab.webkitRequestFullscreen;
        if (req) { var p = req.call(lab); if (p && p.catch) p.catch(fakeFs); }
        else fakeFs();
        function fakeFs() { lab.classList.add("fake-fs"); doc.body.style.overflow = "hidden"; }
      });
    });
  });

  /* ---------- Kit: the API simulations are written against ---------- */
  var labEl = doc.querySelector(".lab"), labVisible = true;
  if (labEl && "IntersectionObserver" in window) {
    new IntersectionObserver(function (es) { labVisible = es[0].isIntersecting; }, { rootMargin: "300px 0px" }).observe(labEl);
  }
  var cs = function () { return getComputedStyle(root); };
  var Kit = {
    version: 1,
    root: doc.querySelector(".lab-body"),
    /* canvas text was laid out for a proportional face; mono overflows the diagram boxes */
    font: { sans: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', mono: '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace' },
    get theme() { return currentTheme(); },
    reducedMotion: !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches),
    /* read one CSS custom property, e.g. Kit.css("--accent") */
    css: function (name) { return cs().getPropertyValue(name.indexOf("--") === 0 ? name : "--" + name).trim(); },
    /* read many at once: Kit.colors(["accent", "ok"]) -> { accent: "#8b5cf6", ok: "..." } */
    colors: function (names) { var s = cs(), o = {}; names.forEach(function (n) { o[n] = s.getPropertyValue("--" + n.replace(/^--/, "")).trim(); }); return o; },
    /* run fn(theme) whenever light/dark changes; returns an unsubscribe function */
    onTheme: function (fn) { themeListeners.push(fn); return function () { themeListeners = themeListeners.filter(function (f) { return f !== fn; }); }; },
    /* animation loop, fn(dtSeconds, nowMs). Skips frames while the lab is off screen or the tab is hidden. */
    loop: function (fn, opts) {
      opts = opts || {}; var maxDt = opts.maxDt || 0.1, last = performance.now(), stopped = false;
      function frame(now) {
        if (stopped) return;
        var dt = Math.min(maxDt, (now - last) / 1000); last = now;
        if ((labVisible || opts.always) && !doc.hidden) {
          try { fn(dt, now); } catch (e) { stopped = true; Kit.fail(e); return; }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      return { stop: function () { stopped = true; } };
    },
    /* size a canvas to its container for a logical width x height scene; returns { ctx, scale, dpr } with the
       transform already applied so you draw in logical units */
    fitCanvas: function (canvas, w, h, opts) {
      opts = opts || {};
      var box = opts.container || canvas.parentElement, avail = Math.max(0, box.clientWidth - 2);
      var scale = Math.min(opts.max || 1.25, Math.max(avail / w, opts.min || 0.5)), dpr = window.devicePixelRatio || 1;
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
        canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
        canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
      }
      var ctx = canvas.getContext("2d"); ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
      return { ctx: ctx, scale: scale, dpr: dpr };
    },
    /* resolves once web fonts are loaded so canvas text measures correctly */
    ready: doc.fonts && doc.fonts.ready ? doc.fonts.ready.then(function () {}) : Promise.resolve(),
    esc: function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); },
    /* show a readable error inside the lab instead of a blank box */
    fail: function (err) {
      console.error(err);
      if (!Kit.root) return;
      var pre = doc.createElement("pre"); pre.className = "lab-error";
      pre.textContent = "The simulation hit an error and stopped.\n\n" + (err && (err.stack || err.message) || err);
      Kit.root.prepend(pre);
    }
  };
  window.Kit = Kit;
})();

</script>
</body>
</html>
